name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release
      - run: ./scripts/bundle.sh
      - run: cd dist && zip -r -y AulaStudio.zip AulaStudio.app
      - uses: actions/upload-artifact@v5
        with:
          name: AulaStudio
          path: dist/AulaStudio.zip
